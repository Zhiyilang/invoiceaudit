name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # The CLI prints Chinese; without this a C-locale runner can blow up on
      # encode. Same class of bug that bit every other repo in this pipeline.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assertion suite
        run: python eval.py

      # Keep proving the CJK-output path survives a hostile locale.
      - name: Hostile locale (no PYTHONUTF8, C locale)
        env:
          PYTHONUTF8: ""
          LC_ALL: C
        run: python eval.py
